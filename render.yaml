services:
  - type: web
    name: linked-by-light-eu
    runtime: node
    region: frankfurt
    branch: main
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BETA_MAX_ROOMS
        value: '5'
