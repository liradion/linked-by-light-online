name: Game quality checks
on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check public-beta.js
          node --check public-beta-http.js
          node --check public/beta.js
          node --check v23-core.js
          node --check v24-world.js
          node --check v25-endless.js
          node --check shared/v23-stages.js
          node --check public/v23plus.js
          node --check public/adventure.js
          node --check public/cloud.js
          node --check scripts/smoke-public-beta.js
          node --check v20-core.js
          node --check v21-core.js
          node --check v21-social.js
          node --check shared/v21-stages.js
          node --check public/v21.js
          node --check public/reconciliation.js
          node --check shared/v20-stages.js
          node --check public/v20.js
          node --check public/client.js
          node --check public/adventure.js
          node --check public/cloud.js
          node --check pwa-icons.js
          node --check public/pwa.js
          node --check public/sw.js
      - name: Run full multiplayer, cloud and PWA test suite
        run: npm test
      - name: Verify an isolated local v22 deployment using the same read-only smoke as production
        shell: bash
        env:
          SMOKE_BASE_URL: http://127.0.0.1:43997
        run: |
          set -euo pipefail
          PORT=43997 BETA_MAX_ROOMS=10 node server.js &
          GAME_PID=$!
          trap 'kill "$GAME_PID" 2>/dev/null || true' EXIT
          node scripts/smoke-public-beta.js
