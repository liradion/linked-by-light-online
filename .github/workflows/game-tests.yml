name: Game quality checks
on:
  push:
    branches: [main, release-pwa-v14]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check pwa-icons.js
          node --check public/pwa.js
          node --check public/sw.js
      - name: Run full multiplayer, cloud and PWA test suite
        run: npm test
