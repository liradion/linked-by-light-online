name: v22 deployment smoke (read-only)
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Full HTTPS origin of the deployment to verify"
        required: true
        default: "https://linked-by-light-eu.onrender.com"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only verify exact v22 version, assets, headers and configuration
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: node scripts/smoke-public-beta.js
