name: v27 browser E2E (Chromium + WebKit)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-24.04
    # Official pinned Playwright image bundles Chromium, WebKit and OS libraries.
    # Avoid slow apt mirror downloads from --with-deps (previous run timed out before testing).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser testing dependencies
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Verify matching preinstalled browser versions
        run: npx playwright --version
      - name: Two-browser multiplayer and reconnect regression
        run: npx playwright test --config=playwright.config.cjs
      - name: Upload trace when any browser fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v27-playwright-failure-trace
          path: test-results/
          retention-days: 7
