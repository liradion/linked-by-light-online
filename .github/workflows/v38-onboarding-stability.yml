name: v38 onboarding stability (zero retries)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  onboarding:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Repeat onboarding in both engines without retry masking
        run: npx playwright test e2e/v30-onboarding.spec.cjs e2e/v38-onboarding-stability.spec.cjs --config=playwright.config.cjs --retries=0 --repeat-each=3 --trace=retain-on-failure
      - name: Preserve failed action traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v38-onboarding-failure-traces
          path: test-results/
          retention-days: 14
